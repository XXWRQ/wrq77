<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f3ee" />
    <meta name="description" content="个人档案、简历与技术知识库。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" />
    <title>领域·展开~</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('personal-blog-theme');
          const theme = saved === 'day' || saved === 'night'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme === 'night' ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').content = theme === 'night' ? '#0d1210' : '#f1f3ee';
        } catch {
          document.documentElement.dataset.theme = 'day';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
